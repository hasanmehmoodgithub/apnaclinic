workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

default:
  image: ghcr.io/cirruslabs/flutter:stable
  interruptible: true
  cache:
    key:
      files:
        - pubspec.lock
    paths:
      - .pub-cache/

stages:
  - verify
  - build

.flutter_setup:
  before_script:
    - flutter --version
    - flutter pub get

analyze:
  extends: .flutter_setup
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - flutter analyze --machine > analysis_report.json || true
  artifacts:
    when: always
    paths:
      - analysis_report.json
    expire_in: 1 day

test:
  extends: .flutter_setup
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - flutter test

danger:
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update && apt-get install -y curl ca-certificates gnupg openssl
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
    - apt-get update && apt-get install -y nodejs
    - |
      if [ -n "$GITLAB_CA_FILE" ] && [ -f "$GITLAB_CA_FILE" ]; then
        cp "$GITLAB_CA_FILE" /tmp/gitlab-ca.pem
        echo "Using custom CA from GITLAB_CA_FILE"
      elif [ -n "$GITLAB_CA_PEM" ]; then
        printf "%s" "$GITLAB_CA_PEM" > /tmp/gitlab-ca.pem
        echo "Using custom CA from GITLAB_CA_PEM"
      else
        echo "No custom GitLab CA provided; attempting to fetch cert chain from $CI_SERVER_HOST."
        openssl s_client -showcerts -servername "$CI_SERVER_HOST" -connect "$CI_SERVER_HOST:443" </dev/null 2>/dev/null \
          | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > /tmp/gitlab-ca.pem || true
        if [ ! -s /tmp/gitlab-ca.pem ]; then
          echo "Could not auto-fetch GitLab cert chain; continuing with system default CAs."
          rm -f /tmp/gitlab-ca.pem
        fi
      fi
    - |
      if [ -f /tmp/gitlab-ca.pem ]; then
        openssl x509 -in /tmp/gitlab-ca.pem -noout -subject
        cp /tmp/gitlab-ca.pem /usr/local/share/ca-certificates/gitlab-ca.crt
        update-ca-certificates
        export NODE_EXTRA_CA_CERTS=/tmp/gitlab-ca.pem
      else
        echo "WARNING: No custom CA found. Falling back to insecure TLS for Danger API calls."
        export NODE_TLS_REJECT_UNAUTHORIZED=0
      fi
    - node -v && npm -v
    - npm install -g danger
    - flutter pub get
  needs:
    - job: analyze
      artifacts: true
  script:
    - dart run danger_dart ci
  variables:
    DANGER_GITLAB_API_TOKEN: $DANGER_GITLAB_API_TOKEN

.build_android:
  extends: .flutter_setup
  stage: build
  timeout: 45m
  interruptible: false
  cache:
    key:
      files:
        - pubspec.lock
        - android/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .pub-cache/
      - .gradle/
  after_script:
    - rm -f hmac.keys.json android/app/econceptions.jks

build_android_staging:
  extends: .build_android
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  needs:
    - job: test
      optional: true
  script:
    - bash tool/ci/build_android.sh staging apk
  artifacts:
    when: on_success
    paths:
      - build/app/outputs/flutter-apk/*.apk
    expire_in: 14 days

build_android_production:
  extends: .build_android
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  needs:
    - job: test
      optional: true
  script:
    - bash tool/ci/build_android.sh production appbundle
  artifacts:
    when: on_success
    paths:
      - build/app/outputs/bundle/release/*.aab
    expire_in: 30 days
